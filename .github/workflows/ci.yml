name: Kanto Ascendant CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Kanto Ascendant
        uses: actions/checkout@v4
        with:
          path: kanto-ascendant

      - name: Check out the compatible Gen1 Recomp engine
        uses: actions/checkout@v4
        with:
          repository: bryanthaboi/gen1recomp
          ref: 50947eec2aa0404f71b2b105bba837e3629e0cb6
          path: gen1recomp

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0

      - name: Prepare the minimum 0.1.90 source fixture
        working-directory: gen1recomp
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = Path("src/core/Version.lua")
          source = version.read_text(encoding="utf-8")
          placeholder = 'engine = "0.0.0-dev"'
          if source.count(placeholder) != 1:
              raise SystemExit("unexpected Gen1 Recomp Version.lua fixture")
          version.write_text(
              source.replace(placeholder, 'engine = "0.1.90"', 1),
              encoding="utf-8",
          )

          fixture = Path("tests/fixture_data/constants.lua")
          generated = Path("data/generated/constants.lua")
          if not fixture.is_file():
              raise SystemExit("missing Gen1 Recomp fixture constants")
          generated.parent.mkdir(parents=True, exist_ok=True)
          generated.write_bytes(fixture.read_bytes())
          PY

      - name: Reject whitespace errors
        working-directory: kanto-ascendant
        run: |
          if git grep -nI -E '[[:blank:]]+$'; then
            echo "Trailing whitespace found."
            exit 1
          fi

      - name: Validate the packaged mod against fixture data
        working-directory: gen1recomp
        env:
          MODKIT_LUAJIT: luajit
        run: |
          ignore_file="../kanto-ascendant/.modkitignore"

          # The pinned minimum-version ModKit understands exact ignore paths,
          # but not the later directory-prefix form. Expand those prefixes in
          # this disposable CI checkout and retain the expansion for the later
          # release pack step. The authored checkout is never committed.
          python3 - "$ignore_file" <<'PY'
          from pathlib import Path
          import sys

          ignore = Path(sys.argv[1])
          root = ignore.parent
          original = ignore.read_text(encoding="utf-8")
          additions = []
          known = {
              line.strip()
              for line in original.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }

          for raw in original.splitlines():
              entry = raw.strip()
              if not entry or entry.startswith("#") or not entry.endswith("/"):
                  continue
              directory = root / entry[:-1]
              if not directory.is_dir():
                  continue
              for path in sorted(directory.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root).as_posix()
                  if relative not in known:
                      known.add(relative)
                      additions.append(relative)

          if additions:
              ignore.write_text(
                  original.rstrip("\n")
                  + "\n\n# Expanded temporarily for the pinned CI ModKit.\n"
                  + "\n".join(additions)
                  + "\n",
                  encoding="utf-8",
              )
          PY

          python3 tools/modkit.py validate \
            ../kanto-ascendant --base fixture --strict

      - name: Run the ROM-free regression suite
        working-directory: gen1recomp
        env:
          POKEPORT_DATA_DIR: tests/fixture_data
          TRAINER_REMATCH_MOD_DIR: ../kanto-ascendant
        run: |
          luajit ../kanto-ascendant/tests/trainer_rematch_test.lua
          luajit ../kanto-ascendant/tests/rematch_evolved_battler_test.lua
          luajit ../kanto-ascendant/tests/starter_signature_families_test.lua
          luajit ../kanto-ascendant/tests/gorochu_visuals_test.lua
          luajit ../kanto-ascendant/tests/gorochu_audio_matrix_test.lua
          luajit ../kanto-ascendant/tests/field_economy_test.lua
          luajit ../kanto-ascendant/tests/espeon_psybeam_regression_test.lua
          luajit ../kanto-ascendant/tests/atlas_legacy_test.lua
          luajit ../kanto-ascendant/tests/reachability_test.lua
          luajit ../kanto-ascendant/tests/upgrade_matrix_test.lua
          luajit ../kanto-ascendant/tests/crystal_v15_test.lua
          luajit ../kanto-ascendant/tests/crystal_2d_enemy_layout_test.lua
          python3 ../kanto-ascendant/tests/crystal_v15_assets_test.py
          luajit ../kanto-ascendant/tests/extended_characters_test.lua
          luajit ../kanto-ascendant/tests/rival_personality_dialogue_test.lua
          luajit ../kanto-ascendant/tests/oak_lab_identity_dialogue_test.lua
          luajit ../kanto-ascendant/tests/yellow_german_oak_dialogue_test.lua
          luajit ../kanto-ascendant/tests/prename_placeholder_654_test.lua
          luajit ../kanto-ascendant/tests/extended_characters_yellow_test.lua
          luajit ../kanto-ascendant/tests/rival_teams_test.lua
          luajit ../kanto-ascendant/tests/pokemon_gender_test.lua
          luajit ../kanto-ascendant/tests/breeding_phase7_test.lua
          luajit ../kanto-ascendant/tests/crystal_walk_assets_test.lua \
            ../kanto-ascendant
          python3 ../kanto-ascendant/tests/crystal_character_assets_test.py
          python3 ../kanto-ascendant/tools/character_asset_tool.py validate
          python3 ../kanto-ascendant/tests/kanto_shiny_follower_assets_test.py
          luajit ../kanto-ascendant/tests/kanto_shiny_follower_routing_test.lua

      # The public engine checkout deliberately contains no ROM-derived data.
      # These existing tests remain mandatory private release gates against a
      # locally imported engine and must not be presented as ROM-free checks:
      #   tests/johto_move_reminder_engine_test.lua
      #   tests/legacy_252_279_data_engine_test.lua
      #   tests/legacy_rival_partner_engine_test.lua
      #   tests/vanilla_kanto_content_boundary_test.lua
      #   tests/runtime_npc_public_placement_engine_test.lua

      - name: Run the Johto Signals regression suite
        working-directory: kanto-ascendant
        env:
          GEN1RECOMP_ROOT: ../gen1recomp
        run: |
          luajit tests/johto_encounter_levels_test.lua
          luajit tests/johto_signals_test.lua
          luajit tests/johto_signals_content_test.lua
          luajit tests/johto_signals_hub_test.lua
          luajit tests/johto_signals_dialogue_test.lua
          luajit tests/driftglass_prisms_test.lua
          luajit tests/johto_signals_wilds_test.lua
          luajit tests/wilds_1_7_1_compat_test.lua
          luajit tests/johto_signals_ui_integration_test.lua
          luajit tests/legacy_starters_test.lua
          luajit tests/hevo_species_test.lua
          python3 tests/johto_signals_scope_audit_test.py

      - name: Run the engine-backed Johto Signals suite
        working-directory: gen1recomp
        env:
          POKEPORT_DATA_DIR: tests/fixture_data
          KANTO_SIGNALS_MOD_DIR: ../kanto-ascendant
          TRAINER_REMATCH_MOD_DIR: ../kanto-ascendant
        run: |
          luajit ../kanto-ascendant/tests/johto_signals_map_test.lua
          luajit ../kanto-ascendant/tests/driftglass_prisms_map_test.lua
          luajit ../kanto-ascendant/tests/mythic_signals_test.lua

      - name: Run the 6.5 integration and UI suite
        working-directory: kanto-ascendant
        env:
          GEN1RECOMP_ROOT: ../gen1recomp
        run: |
          luajit tests/qol_6_5_test.lua
          python3 tests/core_phase10_audit_test.py
          python3 tests/starter_signature_tech_package_driver_contract_test.py
          python3 tests/verify_rc_runtime_contract_test.py
          python3 tests/potato_voxel_172_visual_contract_test.py
          python3 tests/ascendant_ui_audit_test.py
          python3 tests/gorochu_follower_quality_test.py
          python3 tests/gorochu_crystal_animation_test.py
          python3 tests/gorochu_voxel_animation_test.py
          python3 tests/raichu_portrait_assets_test.py
          luajit tests/hgss_box_grid_icons_test.lua
          luajit tests/runtime_npc_public_placement_test.lua
          luajit tests/ascendant_archive_research_count_67_test.lua

      - name: Run the ROM-free legacy fixture suites
        working-directory: kanto-ascendant
        env:
          GEN1RECOMP_DIR: ../gen1recomp
        run: |
          luajit tests/legacy_archive_test.lua
          luajit tests/legacy_journey_test.lua
          luajit tests/legacy_locker_quantity_test.lua

      - name: Run the engine-backed 6.5 systems suite
        working-directory: gen1recomp
        env:
          POKEPORT_DATA_DIR: tests/fixture_data
          TRAINER_REMATCH_MOD_DIR: ../kanto-ascendant
          KA_STORY_GYM_FIXTURE: ../kanto-ascendant/tests/fixtures/story_gym_contract.lua
        run: |
          luajit ../kanto-ascendant/tests/id_migration_test.lua
          luajit ../kanto-ascendant/tests/mod_conflicts_test.lua
          luajit ../kanto-ascendant/tests/follower_phase1_assets_test.lua
          luajit ../kanto-ascendant/tests/follower_phase2_assets_test.lua
          luajit ../kanto-ascendant/tests/follower_phase2_test.lua
          luajit ../kanto-ascendant/tests/follower_phase3_registry_test.lua
          luajit ../kanto-ascendant/tests/follower_phase4_chain_test.lua
          luajit ../kanto-ascendant/tests/follower_phase5_config_test.lua
          luajit ../kanto-ascendant/tests/follower_cap6_regression_test.lua
          luajit ../kanto-ascendant/tests/follower_friendship_feedback_test.lua
          luajit ../kanto-ascendant/tests/legacy_wanderers_test.lua
          luajit ../kanto-ascendant/tests/legacy_wanderers_progression_test.lua
          luajit ../kanto-ascendant/tests/legacy_wanderer_title_test.lua
          luajit ../kanto-ascendant/tests/legacy_wanderer_title_engine_test.lua
          luajit ../kanto-ascendant/tests/rematch_phase6_test.lua
          luajit ../kanto-ascendant/tests/rematch_visual_option_invariance_6511_test.lua
          luajit ../kanto-ascendant/tests/runtime_locale_authority_67_test.lua
          luajit ../kanto-ascendant/tests/visual_options_categories_de_test.lua
          luajit ../kanto-ascendant/tests/rematch_phase7_test.lua
          luajit ../kanto-ascendant/tests/rematch_phase8_test.lua
          luajit ../kanto-ascendant/tests/rematch_break_profiles_test.lua
          KA_ENGINE_ROOT=. KA_EXPECT_ENGINE=0.1.90 \
            luajit ../kanto-ascendant/tests/rematch_break_profiles_engine_test.lua
          luajit ../kanto-ascendant/tests/adaptive_trainer_levels_test.lua
          KA_EXPECT_ENGINE=broad luajit ../kanto-ascendant/tests/adaptive_trainer_levels_engine_test.lua
          luajit ../kanto-ascendant/tests/difficulty_early_curve_test.lua
          luajit ../kanto-ascendant/tests/story_gym_difficulty_test.lua
          luajit ../kanto-ascendant/tests/story_gym_move_legality_test.lua
          luajit ../kanto-ascendant/tests/story_gym_johto_moves_test.lua
          luajit ../kanto-ascendant/tests/yellow_gym_move_fidelity_test.lua
          luajit ../kanto-ascendant/tests/yellow_mtmoon_fossil_dialogue_test.lua \
            ../kanto-ascendant
          luajit ../kanto-ascendant/tests/gorochu_rematch_loot_test.lua
          luajit ../kanto-ascendant/tests/rematch_reward_documentation_test.lua
          luajit ../kanto-ascendant/tests/rematch_ai_test.lua
          luajit ../kanto-ascendant/tests/core_phase9_test.lua
          luajit ../kanto-ascendant/tests/mythic_safety_test.lua
          luajit ../kanto-ascendant/tests/ascendant_ui_test.lua
          luajit ../kanto-ascendant/tests/party_icons_test.lua
          luajit ../kanto-ascendant/tests/help_and_bag_test.lua
          luajit ../kanto-ascendant/tests/options_full_contract_test.lua
          luajit ../kanto-ascendant/tests/voxel_renderer_compat_test.lua
          luajit ../kanto-ascendant/tests/potato_voxel_172_manager_test.lua
          luajit ../kanto-ascendant/tests/battle_art_voxel_compat_test.lua
          luajit ../kanto-ascendant/tests/dramaless_camera_compat_test.lua
          luajit ../kanto-ascendant/tests/dramaless_camera_option_menu_test.lua
          luajit ../kanto-ascendant/tests/dramaless_wall_decals_compat_test.lua
          luajit ../kanto-ascendant/tests/wilds_spawn_safety_655_test.lua

      - name: Audit the 6.5.13 release boundary
        working-directory: kanto-ascendant
        run: python3 tools/johto_signals_release_audit.py .

      - name: Build and inspect the launcher package
        working-directory: gen1recomp
        env:
          MODKIT_LUAJIT: luajit
        run: |
          python3 tools/modkit.py pack ../kanto-ascendant \
            -o ../kanto_ascendant-6.5.13.zip
          unzip -tq ../kanto_ascendant-6.5.13.zip
          (
            cd ..
            sha256sum kanto_ascendant-6.5.13.zip \
              > SHA256SUMS-6.5.13.txt
          )
          python3 ../kanto-ascendant/tools/johto_signals_release_audit.py \
            ../kanto_ascendant-6.5.13.zip
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile

          package = "../kanto_ascendant-6.5.13.zip"
          forbidden_prefixes = (
              "art_review/",
              "artifacts/",
              "assets/sources/",
              "docs/",
              "qa/",
              "tests/",
              "tools/",
          )
          forbidden_files = {
              ".luarc.json",
              "DISCORD_FIXES_EN.md",
              "DISCORD_POST_EN.md",
              "docs/FUTURE_FORM_BACKLOG.md",
              "docs/MEGA_FORM_PIPELINE.md",
              "docs/NEXT_MAJOR_UPDATE_STARFALL_TIDES.md",
          }
          required_files = {
              "assets/audio/gorochu/gorochu_cry.wav",
              "assets/followers/gorochu.png",
              "assets/followers/shiny/gorochu.png",
              "assets/followers_runtime/normal/follower_GOROCHU.png",
              "assets/followers_runtime/shiny/follower_GOROCHU.png",
              "assets/voxel/gorochu/gorochu_back.png",
              "assets/voxel/gorochu/gorochu_back_shiny.png",
              "assets/voxel/gorochu/gorochu_front.png",
              "assets/voxel/gorochu/gorochu_front_shiny.png",
              "gorochu_visuals.lua",
              "driftglass_prisms.lua",
              "johto_encounter_levels.lua",
              "johto_signals.lua",
              "johto_signals_content.lua",
              "johto_signals_hub.lua",
              "johto_signals_state.lua",
              "johto_signals_wilds.lua",
              "mythic_signals.lua",
              "rematch_roster_authority.lua",
              "legacy_hoenn.lua",
              "legacy_starters.lua",
              "hevo_species.lua",
              "hevo_species_data.lua",
              "assets/audio/legacy_hoenn_cries/252.ogg",
              "assets/audio/legacy_hoenn_cries/260.ogg",
              "assets/legacy_hoenn/front/252.png",
              "assets/legacy_hoenn/back/260.png",
              "assets/audio/hevo_19_cries/261.ogg",
              "assets/audio/hevo_19_cries/279.ogg",
              "assets/hevo_19/front/261.png",
              "assets/hevo_19/back/279.png",
              "assets/crystal_animated/front/normal/261/001.png",
              "assets/crystal_animated/back/shiny/279/001.png",
              "modern_ball_skins.lua",
              "modern_storage_ui.lua",
              "trainer_card_hd_standard.lua",
              "assets/characters/crystal_chars/red_voxel_front_hd.png",
              "assets/characters/crystal_chars/green_voxel_front_hd.png",
              "assets/characters/crystal_chars/blue_voxel_front_hd.png",
              "assets/characters/frlg_trainers/leader_brock_voxel_front_hd_v2.png",
              "assets/characters/frlg_trainers/leader_misty_voxel_front_hd_v2.png",
              "assets/characters/frlg_trainers/leader_lt_surge_voxel_front_hd_v2.png",
              "assets/characters/frlg_trainers/leader_erika_voxel_front_hd_v2.png",
              "assets/characters/frlg_trainers/leader_koga_voxel_front_hd_v2.png",
              "assets/characters/frlg_trainers/leader_sabrina_voxel_front_hd_v2.png",
              "assets/characters/frlg_trainers/leader_blaine_voxel_front_hd_v2.png",
              "assets/characters/frlg_trainers/leader_giovanni_voxel_front_hd_v2.png",
              "useful_bag.lua",
              "catch_destination.lua",
              "party_icons.lua",
              "adaptive_trainer_levels.lua",
              "story_gym_difficulty.lua",
              "yellow_gym_move_fidelity.lua",
              "rematch_break_profiles.lua",
              "yellow_mtmoon_fossil_dialogue.lua",
              "crystal_animation_data_grayscale.lua",
              "crystal_v15_features.lua",
              "assets/crystal_v15/provenance.json",
              "assets/crystal_animated/front/grayscale/1/001.png",
              "assets/crystal_animated/front/grayscale/251/001.png",
              "assets/crystal_animated/back/normal/1/001.png",
              "assets/crystal_animated/back/shiny/151/001.png",
              "assets/crystal_animated/back/grayscale/151/001.png",
              "assets/crystal_v15/trainers/normal/red.png",
              "assets/crystal_v15/trainers/grayscale/red.png",
              "assets/followers_kanto/shiny/palette_contract.json",
              "assets/characters/crystal_chars/red_walk.png",
              "assets/characters/crystal_chars/green_walk.png",
              "assets/characters/crystal_chars/blue_walk.png",
              "assets/characters/crystal_chars/fallback_walk_v3/green_walk.png",
              "assets/characters/crystal_chars/fallback_walk_v2/red_walk.png",
              "assets/characters/crystal_chars/fallback_walk_v2/green_walk.png",
              "assets/characters/crystal_chars/fallback_walk_v2/blue_walk.png",
              "assets/characters/crystal_chars/fallback_walk_v1/red_walk.png",
              "assets/characters/crystal_chars/fallback_walk_v1/green_walk.png",
              "assets/characters/crystal_chars/fallback_walk_v1/blue_walk.png",
          }

          expected_kanto_normal = {
              f"assets/followers_kanto/follower_{dex_number:03d}.png"
              for dex_number in range(1, 152)
          }
          expected_kanto_shiny = {
              f"assets/followers_kanto/shiny/follower_{dex_number:03d}.png"
              for dex_number in range(1, 152)
          }
          expected_box_grid_walkers = {
              "vendor/wilds_1_12_2/assets/bundled_runtime/"
              "followsprites_runtime/"
              f"{dex_number:03d}-{variant}.png"
              for dex_number in range(1, 650)
              for variant in ("normal", "shiny")
          }
          required_files |= (
              expected_kanto_normal
              | expected_kanto_shiny
              | expected_box_grid_walkers
          )

          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              leaked = sorted(
                  name for name in names
                  if name in forbidden_files
                  or name.startswith(forbidden_prefixes)
                  or (
                      name.startswith("RELEASE_NOTES_")
                      and name.endswith(".md")
                  )
              )
              if leaked:
                  raise SystemExit(
                      "Release-only files leaked into the package:\n"
                      + "\n".join(leaked)
                  )

              missing = sorted(required_files - names)
              if missing:
                  raise SystemExit(
                      "Required runtime files are missing:\n"
                      + "\n".join(missing)
                  )

              actual_kanto_normal = {
                  name for name in names
                  if name.startswith("assets/followers_kanto/follower_")
                  and name.endswith(".png")
              }
              actual_kanto_shiny = {
                  name for name in names
                  if name.startswith("assets/followers_kanto/shiny/follower_")
                  and name.endswith(".png")
              }
              if actual_kanto_normal != expected_kanto_normal:
                  raise SystemExit("Kanto normal follower catalogue is not exactly #001-151")
              if actual_kanto_shiny != expected_kanto_shiny:
                  raise SystemExit("Kanto Shiny follower catalogue is not exactly #001-151")

              actual_box_grid_walkers = {
                  name for name in names
                  if name.startswith(
                      "vendor/wilds_1_12_2/assets/bundled_runtime/"
                      "followsprites_runtime/"
                  ) and name.endswith(".png")
              }
              if actual_box_grid_walkers != expected_box_grid_walkers:
                  raise SystemExit(
                      "Bundled Box-grid walker catalogue is not exactly "
                      "#001-649 normal/Shiny"
                  )

              contract = json.loads(archive.read(
                  "assets/followers_kanto/shiny/palette_contract.json"
              ))
              entries = contract.get("entries") or []
              if [entry.get("dex") for entry in entries] != list(range(1, 152)):
                  raise SystemExit("Kanto Shiny palette contract Dex order is not #001-151")
              for entry in entries:
                  dex_number = entry["dex"]
                  normal_name = (
                      f"assets/followers_kanto/follower_{dex_number:03d}.png"
                  )
                  shiny_name = (
                      "assets/followers_kanto/shiny/"
                      f"follower_{dex_number:03d}.png"
                  )
                  normal_hash = hashlib.sha256(
                      archive.read(normal_name)
                  ).hexdigest()
                  shiny_hash = hashlib.sha256(
                      archive.read(shiny_name)
                  ).hexdigest()
                  if normal_hash != entry.get("normalSha256"):
                      raise SystemExit(f"Kanto normal follower hash drift: #{dex_number:03d}")
                  if shiny_hash != entry.get("shinySha256"):
                      raise SystemExit(f"Kanto Shiny follower hash drift: #{dex_number:03d}")

              manifest = json.loads(archive.read("manifest.json"))
              if manifest.get("version") != "6.5.13":
                  raise SystemExit(
                      "Expected manifest version 6.5.13, got "
                      + repr(manifest.get("version"))
                  )

          print("Package contents and manifest version are release-clean.")
          PY

      - name: Upload the verified release
        uses: actions/upload-artifact@v4
        with:
          name: kanto-ascendant-6.5.13-release
          if-no-files-found: error
          path: |
            kanto_ascendant-6.5.13.zip
            SHA256SUMS-6.5.13.txt
